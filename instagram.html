<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Instagram-Mappe">
<meta name="theme-color" content="#F5F0EA">
<title>Instagram-Mappe — A great hair day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F0EA;--surface:#FCFAF5;--ink:#1C1B19;--sub:#5B5750;
  --line:#E4DCCD;--gold:#8A7346;--gold-light:#EFE6D4;--gold-ink:#5a4a28;--warn:#8A3B22;--warn-bg:#F3E1DA;
  --serif:'Playfair Display',Georgia,serif;--sans:'Inter',system-ui,sans-serif;--r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);display:flex;justify-content:center;min-height:100vh;}
.wrap{width:100%;max-width:480px;padding:22px 16px 60px;display:flex;flex-direction:column;gap:18px;}
header{text-align:center;padding:6px 0 2px;}
.zurueck{align-self:flex-start;font-size:13px;color:var(--sub);text-decoration:none;}
.wordmark{font-family:var(--serif);font-weight:700;font-size:26px;}
.wordmark span{color:var(--gold);}
.rule{width:64px;height:2px;background:var(--gold);margin:12px auto;}
.intro{font-size:14px;color:var(--sub);line-height:1.5;}
.label{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--gold);}
.modus{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--gold-light);padding:4px;border-radius:12px;}
.modus button{border:none;background:none;border-radius:9px;padding:10px;font:600 14px var(--sans);color:var(--gold-ink);cursor:pointer;}
.modus button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08);}
.liste{display:flex;flex-direction:column;gap:14px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;display:flex;flex-direction:column;gap:10px;}
.card h2{font-family:var(--serif);font-size:19px;line-height:1.3;}
.meta{font-size:12px;color:var(--sub);line-height:1.45;}
.folien{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory;}
.folien a{flex:0 0 auto;scroll-snap-align:start;}
.folien img{width:128px;height:160px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;background:var(--gold-light);}
.knoepfe{display:flex;flex-wrap:wrap;gap:8px;}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font:600 13px var(--sans);color:var(--ink);cursor:pointer;}
.btn.haupt{background:var(--gold);border-color:var(--gold);color:#fff;}
.btn.neu{width:100%;padding:13px;font-size:15px;background:var(--ink);border-color:var(--ink);color:#fff;}
.folien canvas{width:128px;height:160px;border-radius:8px;border:1px solid var(--line);display:block;flex:0 0 auto;background:var(--gold-light);}
.btn.ok{background:var(--gold-light);border-color:var(--gold);color:var(--gold-ink);}
details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--gold-ink);}
.text{white-space:pre-wrap;font-size:14px;line-height:1.5;background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:8px;word-break:break-word;}
.zeile{display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--bg);border-radius:10px;padding:8px 8px 8px 12px;}
.zeile span{font-size:14px;font-weight:500;word-break:break-word;}
.zeile .btn{padding:6px 10px;font-size:12px;flex:0 0 auto;}
.zaehler{font-size:11px;color:var(--sub);text-align:right;}
.punkte{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:2px 9px;background:var(--gold-light);color:var(--gold-ink);}
.hinweis{font-size:13px;line-height:1.45;color:var(--gold-ink);background:var(--gold-light);border-radius:10px;padding:8px 11px;}
.hinweis.warnung{color:var(--warn);background:var(--warn-bg);}
.todo{display:flex;flex-direction:column;gap:6px;}
.todo label{display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.4;cursor:pointer;}
.todo input{margin-top:3px;accent-color:var(--gold);width:16px;height:16px;flex:0 0 auto;}
.todo label.fertig span{color:var(--sub);text-decoration:line-through;}
.fuss{font-size:12px;color:var(--sub);line-height:1.5;text-align:center;}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
[hidden]{display:none!important;}
</style>
<script src="https://mirjamwalenta-a11y.github.io/abwesenheiten-ghd/ghd-offline.js"></script>  <!-- offline nutzbar: Service Worker, gemerkte Daten, Nachsync -->
<script src="instagram-mappe.js"></script>
<script src="karussell-canvas.js"></script>
</head>
<body>
<div class="wrap">
  <a class="zurueck" href="index.html">← Zurück zu Moment</a>
  <header>
    <div class="wordmark">Instagram-<span>Mappe</span></div>
    <div class="rule"></div>
    <p class="intro">Fertige Karussells zum Posten und die neuen Texte für deine drei Profile. Nichts wird automatisch gepostet.</p>
  </header>

  <div class="modus" role="tablist">
    <button role="tab" id="tab-karussells" aria-selected="true" onclick="zeigeTab('karussells')">Karussells</button>
    <button role="tab" id="tab-profile" aria-selected="false" onclick="zeigeTab('profile')">Profile</button>
  </div>

  <section id="karussells" class="liste">
    <button class="btn neu" onclick="location.href='index.html?zeige=karussell'">＋ Neues Karussell</button>
    <div id="eigene" class="liste"></div>
    <div id="feste" class="liste"></div>
  </section>
  <section id="profile" class="liste" hidden></section>

  <p class="fuss">Neue Karussells und Profil-Checks macht Claude mit den Instagram-Helfern im Repo und legt sie hier ab.</p>
</div>

<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const folienPfade = k => Array.from({ length: k.folien }, (_, i) => `bilder/karussells/${k.id}/folie-${String(i + 1).padStart(2, '0')}.png`);

function zeigeTab(name) {
  for (const t of ['karussells', 'profile']) {
    document.getElementById(t).hidden = t !== name;
    document.getElementById('tab-' + t).setAttribute('aria-selected', t === name);
  }
  try { localStorage.setItem('ig-mappe-tab', name); } catch (_) {}
}

function kopieren(text, btn) {
  const fertig = () => {
    const alt = btn.textContent;
    btn.textContent = '✓ Kopiert'; btn.classList.add('ok');
    setTimeout(() => { btn.textContent = alt; btn.classList.remove('ok'); }, 1800);
  };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(fertig, () => alert(text));
  else alert(text);
}

// Teilen öffnet am Handy das Teilen-Menü (dort „Instagram“ oder „Bilder speichern“).
// Geht das nicht, werden die Bilder einzeln heruntergeladen.
async function alleTeilen(id, btn) {
  const k = KARUSSELLS.find(x => x.id === id);
  const pfade = folienPfade(k);
  btn.disabled = true;
  const alt = btn.textContent;
  btn.textContent = 'Bilder werden geladen …';
  try {
    const dateien = await Promise.all(pfade.map(async p => {
      const blob = await (await fetch(p)).blob();
      return new File([blob], `${k.id}-${p.split('/').pop()}`, { type: 'image/png' });
    }));
    if (navigator.canShare && navigator.canShare({ files: dateien })) {
      await navigator.share({ files: dateien, title: k.titel });
    } else {
      for (const d of dateien) {
        const a = document.createElement('a');
        const url = URL.createObjectURL(d);
        a.href = url; a.download = d.name;
        document.body.appendChild(a); a.click();
        setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1000);
        await new Promise(r => setTimeout(r, 300));
      }
    }
  } catch (e) {
    if (!(e && e.name === 'AbortError')) alert('Das hat nicht geklappt. Tipp auf ein Bild, dann kannst du es einzeln speichern.');
  }
  btn.disabled = false; btn.textContent = alt;
}

function renderKarussells() {
  document.getElementById('feste').innerHTML = KARUSSELLS.map(k => `
    <div class="card">
      <div class="label">Karussell · ${k.folien} Folien</div>
      <h2>${esc(k.titel)}</h2>
      <div class="meta">Wohin: ${esc(k.profil)}</div>
      <div class="folien">${folienPfade(k).map((p, i) => `<a href="${p}" target="_blank" rel="noopener"><img src="${p}" loading="lazy" alt="Folie ${i + 1}"></a>`).join('')}</div>
      <div class="knoepfe">
        <button class="btn haupt" onclick="alleTeilen('${k.id}', this)">📲 Alle Bilder teilen</button>
        <button class="btn" onclick="kopieren(KARUSSELLS.find(x => x.id === '${k.id}').caption, this)">📋 Caption</button>
        <button class="btn" onclick="kopieren(KARUSSELLS.find(x => x.id === '${k.id}').alt, this)">📋 Alternativtext</button>
        ${k.daten ? `<button class="btn" onclick="location.href='index.html?zeige=karussell&k=${k.id}'">✏️ Bearbeiten</button>` : ''}
      </div>
      <details><summary>Caption ansehen</summary><div class="text">${esc(k.caption)}</div></details>
    </div>`).join('');
}

// Karussells, die in Moment erstellt und „In Mappe“ gespeichert wurden (nur auf diesem Gerät).
function eigeneLaden() { try { return JSON.parse(localStorage.getItem('ig-karussells-eigene') || '[]'); } catch (_) { return []; } }
function eigenesLoeschen(id) {
  if (!confirm('Dieses Karussell von diesem Gerät löschen?')) return;
  try { localStorage.setItem('ig-karussells-eigene', JSON.stringify(eigeneLaden().filter(k => k.id !== id))); } catch (_) {}
  renderEigene();
}
async function renderEigene() {
  const liste = eigeneLaden();
  const wrap = document.getElementById('eigene');
  wrap.innerHTML = liste.map(k => `
    <div class="card">
      <div class="label">Auf diesem Gerät · ${esc(k.erstellt || '')}</div>
      <h2>${esc(k.titel)}</h2>
      <div class="folien" id="vorschau-${esc(k.id)}">${k.daten.folien.map(() => '<canvas></canvas>').join('')}</div>
      <div class="knoepfe">
        <button class="btn haupt" onclick="location.href='index.html?zeige=karussell&k=${encodeURIComponent(k.id)}'">✏️ Öffnen &amp; teilen</button>
        <button class="btn" onclick="kopieren(eigeneLaden().find(x => x.id === '${esc(k.id)}').caption, this)">📋 Caption</button>
        <button class="btn" onclick="eigenesLoeschen('${esc(k.id)}')">🗑</button>
      </div>
    </div>`).join('');
  for (const k of liste) {
    const leinwaende = document.getElementById('vorschau-' + k.id).children;
    for (let i = 0; i < leinwaende.length; i++) await KarussellCanvas.zeichne(leinwaende[i], k.daten, i);
  }
}

function ladeErledigt() { try { return JSON.parse(localStorage.getItem('ig-mappe-todo') || '{}'); } catch (_) { return {}; } }
function merkeErledigt(schluessel, an) {
  const e = ladeErledigt(); e[schluessel] = an;
  try { localStorage.setItem('ig-mappe-todo', JSON.stringify(e)); } catch (_) {}
  renderProfile();
}

function renderProfile() {
  const erledigt = ladeErledigt();
  document.getElementById('profile').innerHTML = PROFILE.map(p => {
    const fertig = p.todo.filter((_, i) => erledigt[`${p.id}-${i}`]).length;
    return `
    <div class="card">
      <div class="label">Profil · <span class="punkte">${esc(p.punkte)} / 100</span></div>
      <h2>${esc(p.name)}</h2>
      <div class="meta">${esc(p.aufgabe)}</div>
      <div class="label">Namensfeld (eine Variante wählen)</div>
      ${p.namensfeld.map((n, i) => `<div class="zeile"><span>${esc(n)}</span><button class="btn" onclick="kopieren(PROFILE.find(x => x.id === '${p.id}').namensfeld[${i}], this)">📋 Kopieren</button></div>`).join('')}
      <div class="label">Bio</div>
      <div class="text" style="margin-top:0">${esc(p.bio)}</div>
      <div class="zaehler">${p.bio.length} / 150 Zeichen</div>
      <div class="knoepfe"><button class="btn" onclick="kopieren(PROFILE.find(x => x.id === '${p.id}').bio, this)">📋 Bio kopieren</button></div>
      ${p.hinweis ? `<div class="hinweis${p.warnung ? ' warnung' : ''}">${p.warnung ? '⚠️ ' : ''}${esc(p.hinweis)}</div>` : ''}
      <details${fertig < p.todo.length ? ' open' : ''}><summary>To-do in Instagram · ${fertig}/${p.todo.length} erledigt</summary>
        <div class="todo" style="margin-top:8px">${p.todo.map((t, i) => {
          const k = `${p.id}-${i}`;
          return `<label class="${erledigt[k] ? 'fertig' : ''}"><input type="checkbox" ${erledigt[k] ? 'checked' : ''} onchange="merkeErledigt('${k}', this.checked)"><span>${esc(t)}</span></label>`;
        }).join('')}</div>
      </details>
    </div>`;
  }).join('');
}

renderKarussells();
renderEigene();
renderProfile();
try { if (localStorage.getItem('ig-mappe-tab') === 'profile') zeigeTab('profile'); } catch (_) {}
</script>
</body>
</html>
